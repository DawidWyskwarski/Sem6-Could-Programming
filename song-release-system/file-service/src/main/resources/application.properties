spring.application.name=file-service

server.port=8083

spring.rabbitmq.addresses=${RABBITMQ_URL}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/file_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

spring.cloud.aws.region.static=us-east-1

aws.accessKeyId=${AWS_ACCESS_KEY}
aws.secretAccessKey=${AWS_SECRET_KEY}
aws.sessionToken=${AWS_SESSION_TOKEN}
aws.region=us-east-1

aws.s3.bucket=uni-cloud-music-files
